name: '@miorin/dsh-atlas-continuity'
version: 0.1.0
private: false
description: 'Review repository changes and history, keep workspace notes while the agent works, and optionally enable Resonance mode for spatial co-reading.'
license: MIT
engines:
  dsh: '>=0.2.2-rc.5'
  node: '^22.18.0 || >=24.11.0'
plugins:
  - name: '@miorin/dsh-vcs-panel'
    spec: 0.1.4
    enabled: true
  - name: '@miorin/dsh-sideby-note'
    spec: 0.1.1
    enabled: true
  - name: '@miorin/dsh-resonance'
    spec: link:../dsh-resonance
    enabled: false
