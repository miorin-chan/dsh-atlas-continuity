name: '@miorin/dsh-atlas-continuity'
version: 0.1.0
private: false
description: 'Review repository changes and history, and keep workspace notes while the agent works.'
license: MIT
engines:
  dsh: '>=0.2.2-rc.5'
  node: '^22.18.0 || >=24.11.0'
plugins:
  - name: '@miorin/dsh-vcs-panel'
    spec: link:../dsh-vcs-panel
    enabled: true
  - name: '@miorin/dsh-sideby-note'
    spec: link:../dsh-sideby-note
    enabled: true
